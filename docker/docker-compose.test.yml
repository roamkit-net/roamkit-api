# CI pytest — same PostGIS + Redis images as roamkit-infra/docker/docker-compose.test.yml

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: roamkit-postgis-test
    environment:
      POSTGRES_DB: roamkit_test
      POSTGRES_USER: roamkit
      POSTGRES_PASSWORD: roamkit_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roamkit -d roamkit_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: roamkit-redis-test
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: roamkit-mailpit-test
    ports:
      - "1026:1025"
      - "8026:8025"
