      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
          description: Usage snapshot
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: eSIM not found
      security:
      - bearerAuth: []
      summary: eSIM usage
      tags:
      - eSIM
  /api/v1/orders/:
    post:
      description: Debit prepaid credits then fulfill via the order provider. Idempotent on ``idempotency_key``
        (replay returns 201 with the same body).
      operationId: orders_create
      requestBody:
        content:
          application/json:
            examples:
              CreateOrder:
                summary: Create order
                value:
                  idempotency_key: client-order-uuid-1
                  package_id: airalo-pkg-123
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: Order created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Invalid request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '402':
          content:
            application/json:
              examples:
                InsufficientCredits:
                  summary: Insufficient credits
                  value:
                    balance: '5.000000'
                    code: INSUFFICIENT_CREDITS
                    detail: Insufficient funds
                    missing: '14.500000'
                    required: '19.500000'
              schema:
                $ref: '#/components/schemas/InsufficientCredits'
          description: Insufficient credits
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Package not found or billing disabled
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Spend already in progress
      security:
      - bearerAuth: []
      summary: Create package order
      tags:
      - Orders
  /api/v1/packages/:
    get:
      description: 'List active packages synced from external providers. Additive pricing fields: ``price_usd``
        is the customer charge (authenticated + flag ON may apply a pricing profile); ``list_price_usd``
        is the provider list price.'
      operationId: catalog_packages_list
      parameters:
      - description: Filter by ISO country code
        in: query
        name: country
        schema:
          type: string
      - description: Filter by location slug
        in: query
        name: location
        schema:
          type: string
      - description: A page number within the paginated result set.
        in: query
        name: page
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPackageList'
          description: Paginated packages
      summary: List packages
      tags:
      - Catalog
components:
  schemas:
    ActivateRequest:
      properties:
        password:
          maxLength: 128
          minLength: 8
          type: string
          writeOnly: true
        password_confirm:
          maxLength: 128
          minLength: 8
          type: string
          writeOnly: true
        token:
          minLength: 1
          type: string
        uid:
          minLength: 1
          type: string
      required:
      - password
      - password_confirm
      - token
      - uid
      type: object
    ActivationPolicyEnum:
      description: '* `first_usage` - First usage

        * `installation` - Installation

        * `unknown` - Unknown'
      enum:
      - first_usage
      - installation
      - unknown
      type: string
    AutoTopupPolicy:
      description: Persisted auto top-up policy response (v2 triggers + v3 lifetime).
      properties:
        active_until:
          description: Optional UTC exclusive end bound for policy lifetime (v3). Null means no schedule
            limit.
          format: date-time
          nullable: true
          readOnly: true
          type: string
        cooldown_until:
          format: date-time
          nullable: true
          readOnly: true
          type: string
        created_at:
          format: date-time
          readOnly: true
          type: string
        enabled:
          readOnly: true
          type: boolean
        expiry_enabled:
          readOnly: true
          type: boolean
        id:
          format: uuid
          readOnly: true
          type: string
        last_triggered_at:
          format: date-time
          nullable: true
          readOnly: true
          type: string
        package_id:
          readOnly: true
          type: string
        reason:
          allOf:
          - $ref: '#/components/schemas/ReasonEnum'
          readOnly: true
        remaining_count:
          description: Required when renew_mode is fixed_count.
          nullable: true
          readOnly: true
          type: integer
        renew_mode:
          allOf:
          - $ref: '#/components/schemas/RenewModeEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AutoTopupPolicyStatusEnum'
          readOnly: true
        threshold_mb:
          description: Required when usage_mode is threshold.
          nullable: true
          readOnly: true
          type: integer
        updated_at:
          format: date-time
          readOnly: true
          type: string
        usage_mode:
          allOf:
          - $ref: '#/components/schemas/UsageModeEnum'
          readOnly: true
        version:
          readOnly: true
          type: integer
      required:
      - active_until
      - cooldown_until
      - created_at
      - enabled
      - expiry_enabled
      - id
      - last_triggered_at
      - package_id
      - reason
      - remaining_count
      - renew_mode
      - status
      - threshold_mb
      - updated_at
      - usage_mode
      - version
      type: object
    AutoTopupPolicyStatusEnum:
      description: '* `active` - Active

        * `paused` - Paused

        * `blocked` - Blocked

        * `disabled` - Disabled'
      enum:
      - active
      - paused
      - blocked
      - disabled
      type: string
    AutoTopupPolicyWriteRequest:
      description: PUT body with v2 triggers + optional v3 ``active_until``.
      properties:
        active_until:
          description: Optional UTC exclusive lifetime bound (ISO-8601). Null/omitted = no schedule limit.
          format: date-time
          nullable: true
          type: string
        enabled:
          default: true
          type: boolean
        expiry_enabled:
          type: boolean
        package_id:
          maxLength: 64
          minLength: 1
          type: string
        remaining_count:
          minimum: 0
          nullable: true
          type: integer
        renew_mode:
          $ref: '#/components/schemas/RenewModeEnum'
        threshold_mb:
          minimum: 1
          nullable: true
          type: integer
        usage_mode:
          $ref: '#/components/schemas/UsageModeEnum'
        version:
          description: Expected version for optimistic concurrency (or use If-Match).
          minimum: 0
          nullable: true
          type: integer
      required:
      - expiry_enabled
      - package_id
      - renew_mode
      - usage_mode
      type: object
    Balance:
      properties:
        balance:
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,6})?$
          type: string
      required:
      - balance
      type: object
    BillingConfig:
      description: Public currency / presentation config (ADR-010 ``GET …/billing/config/``).
      properties:
        billing_enabled:
          type: boolean
        config_version:
          type: integer
        display_decimals:
          type: integer
        token_decimals:
          type: integer
        token_name:
          type: string
        token_symbol:
          type: string
      required:
      - billing_enabled
      - config_version
      - display_decimals
      - token_decimals
      - token_name
      - token_symbol
      type: object
    CoverageTypeEnum:
      description: '* `local` - Local

        * `regional` - Regional

        * `global` - Global'
      enum:
      - local
      - regional
      - global
      type: string
    CreateOrderRequest:
      description: Request body for POST /api/v1/orders/.
      properties:
        idempotency_key:
          maxLength: 128
          minLength: 1
          type: string
        package_id:
          maxLength: 64
          minLength: 1
          type: string
      required:
      - idempotency_key
      - package_id
      type: object
    DepositInfo:
      description: Full Polygon USDT deposit metadata for clients (no hardcoded chain/token).
      properties:
        chain_id:
          type: integer
        contract:
          type: string
        eip681_uri:
          type: string
        min_confirmations:
          type: integer
        subscriptions_enabled:
          type: boolean
        token_decimals:
          type: integer
        token_symbol:
          type: string
        vouchers_enabled:
          type: boolean
        wallet:
          type: string
        walletconnect_enabled:
          type: boolean
      required:
      - chain_id
      - contract
      - eip681_uri
      - min_confirmations
      - subscriptions_enabled
      - token_decimals
      - token_symbol
      - vouchers_enabled
      - wallet
      - walletconnect_enabled
      type: object
    DepositPaymentMethodEnum:
      description: '* `wallet_connect` - WalletConnect

        * `cex_manual` - CEX manual'
      enum:
      - wallet_connect
      - cex_manual
      type: string
    DepositRequest:
      properties:
        amount_credited:
          format: decimal
          nullable: true
          pattern: ^-?\d{0,14}(?:\.\d{0,6})?$
          readOnly: true
          type: string
        amount_requested:
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,6})?$
          readOnly: true
          type: string
        created_at:
          format: date-time
          readOnly: true
          type: string
        failure_reason:
          readOnly: true
          type: string
        id:
          format: uuid
          readOnly: true
          type: string
        idempotency_key:
          readOnly: true
          type: string
        payment_method:
          allOf:
          - $ref: '#/components/schemas/DepositPaymentMethodEnum'
          description: 'How the USDT transfer was initiated (WalletConnect or CEX/manual).


            * `wallet_connect` - WalletConnect

            * `cex_manual` - CEX manual'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/DepositRequestStatusEnum'
          description: 'Deposit verification status (pending / completed / failed).


            * `pending` - Pending

            * `completed` - Completed

            * `failed` - Failed'
          readOnly: true
        tx_hash:
          nullable: true
          readOnly: true
          type: string
        updated_at:
          format: date-time
          readOnly: true
          type: string
        verified_at:
          format: date-time
          nullable: true
          readOnly: true
          type: string
      required:
      - amount_credited
      - amount_requested
      - created_at
      - failure_reason
      - id
      - idempotency_key
      - payment_method
      - status
      - tx_hash
      - updated_at
      - verified_at
      type: object
    DepositRequestStatusEnum:
      description: '* `pending` - Pending

        * `completed` - Completed

        * `failed` - Failed'
      enum:
      - pending
      - completed
      - failed
      type: string
    DetailMessage:
      description: Generic success message with a ``detail`` string.
      properties:
        detail:
          type: string
      required:
      - detail
      type: object
    ErrorDetail:
      description: 'Standard DRF ``{"detail": "..."}`` error body.'
      properties:
        detail:
          type: string
      required:
      - detail
      type: object
    Esim:
      description: 'Owned eSIM with ICCID, install, setup, lifecycle, and order snapshot.


        ``note`` is the only writable field (PATCH). It is user-local metadata and

        is never synchronized to Airalo. ``archived_at`` is read-only here; mutate

        via POST archive/unarchive. Future RoamKit-only user metadata

        (``favorite_at``, ``pinned_at``, ``hidden_at``) belongs on the same model

        with the same non-sync rule — presentation only, never lifecycle.'
      properties:
        activated_at:
