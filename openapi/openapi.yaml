  /api/v1/orders/:
    post:
      description: Debit prepaid credits then fulfill via the order provider. Idempotent on ``idempotency_key``
        (replay returns 201 with the same body). Omit ``organization_id`` for personal Account spend;
        set it to purchase against a team Account (requires active membership with ``can_spend``). Client-supplied
        ``account_id`` is never accepted.
      operationId: orders_create
      requestBody:
        content:
          application/json:
            examples:
              CreateOrder(personal):
                summary: Create order (personal)
                value:
                  idempotency_key: client-order-uuid-1
                  package_id: airalo-pkg-123
              CreateOrder(team):
                summary: Create order (team)
                value:
                  idempotency_key: client-order-uuid-2
                  organization_id: 11111111-1111-1111-1111-111111111111
                  package_id: airalo-pkg-123
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: Order created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Invalid request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '402':
          content:
            application/json:
              examples:
                InsufficientCredits:
                  summary: Insufficient credits
                  value:
                    balance: '5.000000'
                    code: INSUFFICIENT_CREDITS
                    detail: Insufficient funds
                    missing: '14.500000'
                    required: '19.500000'
              schema:
                $ref: '#/components/schemas/InsufficientCredits'
          description: Insufficient credits
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Not allowed to spend in organization context
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Package/organization not found or billing disabled
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Spend already in progress
      security:
      - bearerAuth: []
      summary: Create package order
      tags:
      - Orders
