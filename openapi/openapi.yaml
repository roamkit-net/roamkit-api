openapi: 3.0.3
info:
  description: Self-service eSIM API. Public REST under `/api/v1/`. Staff Operations Dashboard under `/api/v1/admin/`
    (read-only). Staff internal tools under `/api/internal/`. Authenticate with JWT Bearer tokens from
    `/api/v1/auth/token/`.
  title: RoamKit API
  version: 1.0.0
servers:
- description: Staging
  url: https://api.staging.roamkit.net
- description: Production
  url: https://api.roamkit.net
tags:
- description: Registration, login, and password reset
  name: Authentication
- description: Prepaid credits, deposits, and wallet balance
  name: Billing
- description: Credit voucher and gift-code redeem (ADR 011)
  name: Vouchers
- description: Package purchase orders
  name: Orders
- description: Packages and locations
  name: Catalog
- description: User eSIM inventory, usage, and top-ups
  name: eSIM
- description: Authenticated user profile
  name: Users
- description: Staff-only read-only Operations Dashboard (members, search, aggregates)
  name: Ops
- description: Staff-only internal tools under `/api/internal/` (pricing preview; not public catalog)
  name: Internal
paths:
  /api/internal/pricing/preview:
    post:
      description: Read-only preview via ``PricingService.resolve``. No ledger writes, no cache mutation,
        no side effects.
      operationId: internal_pricing_preview
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingPreviewRequestRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingPreviewResponse'
          description: Resolved quote
        '400':
          description: Invalid request
        '403':
          description: Staff required
        '404':
          description: Package or account not found
      security:
      - bearerAuth: []
      summary: Preview pricing quote
      tags:
      - Internal
  /api/v1/admin/dashboard/:
    get:
      description: 'Single read-only payload for the ops home page: KPIs, pending work, financial summary,
        destinations, packages, alerts, health, and activity feed. schema_version is stable for additive
        field changes.'
      operationId: ops_dashboard
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsDashboard'
          description: Dashboard
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Staff required
      security:
      - bearerAuth: []
      summary: Operations dashboard aggregate
      tags:
      - Ops
  /api/v1/admin/deposits/:
    get:
      description: Prevent intermediary/browser caching of staff ops payloads.
      operationId: ops_deposits_list
      parameters:
      - description: A page number within the paginated result set.
        in: query
        name: page
        required: false
        schema:
          type: integer
      - description: Number of results to return per page.
        in: query
        name: page_size
        required: false
        schema:
          type: integer
      - description: Filter by tx_hash or user email
        in: query
        name: q
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOpsDepositListItemList'
          description: Paginated deposits
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Staff required
      security:
      - bearerAuth: []
      summary: List deposits
      tags:
      - Ops
  /api/v1/admin/health/:
    get:
      description: 'Staff-only read-only health snapshot: dependencies, workers, providers, metrics, version/deployment
        metadata. Checks are read-only with per-check timeouts; overall_status follows the Observability
        V1 matrix.'
      operationId: ops_health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsHealth'
          description: Health aggregate
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Staff required
      security:
      - bearerAuth: []
      summary: Operations health aggregate
      tags:
      - Ops
  /api/v1/admin/orders/:
    get:
      description: Prevent intermediary/browser caching of staff ops payloads.
      operationId: ops_orders_list
      parameters:
      - description: A page number within the paginated result set.
        in: query
        name: page
        required: false
        schema:
          type: integer
      - description: Number of results to return per page.
        in: query
        name: page_size
        required: false
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOpsOrderListItemList'
          description: Paginated orders
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Staff required
      security:
      - bearerAuth: []
      summary: List orders
      tags:
      - Ops
  /api/v1/admin/search/:
    get:
      description: Search users, orders, deposits, eSIMs, and vouchers. Response always includes all group
        keys (possibly empty).
      operationId: ops_search
      parameters:
      - description: Search query (min 3 chars, or exact UUID)
        in: query
        name: q
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsSearchResponse'
          description: Grouped hits
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Staff required
      security:
      - bearerAuth: []
      summary: Global ops search
      tags:
      - Ops
  /api/v1/admin/users/:
    get:
      description: Prevent intermediary/browser caching of staff ops payloads.
      operationId: ops_users_list
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - description: 'Sort field: email, balance, last_login, flags (prefix with - for descending). Default:
          -created_at.'
        in: query
        name: ordering
        schema:
          type: string
      - description: A page number within the paginated result set.
        in: query
        name: page
        required: false
        schema:
          type: integer
      - description: Number of results to return per page.
        in: query
        name: page_size
        required: false
        schema:
          type: integer
      - description: Filter by email (icontains)
        in: query
        name: q
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOpsUserListItemList'
          description: Paginated members
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Staff required
      security:
      - bearerAuth: []
      summary: List members
      tags:
      - Ops
  /api/v1/admin/users/{id}/:
    get:
      description: Prevent intermediary/browser caching of staff ops payloads.
      operationId: ops_users_retrieve
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsUserDetail'
          description: Member detail
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Staff required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Not found
      security:
      - bearerAuth: []
      summary: Member detail with timeline
      tags:
      - Ops
  /api/v1/auth/activate/:
    post:
      description: Set password from the confirmation link and activate the account.
      operationId: auth_activate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Activated user
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Invalid token or password
      summary: Activate account
      tags:
      - Authentication
  /api/v1/auth/google/:
    post:
      description: Verify a Google Identity Services ID token and return the same SimpleJWT access/refresh
        pair as password login (ADR 015).
      operationId: auth_google
      requestBody:
        content:
          application/json:
            examples:
              Request:
                value:
                  credential: <google_id_token>
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                Success:
                  value:
                    access: eyJ...
                    refresh: eyJ...
              schema:
                $ref: '#/components/schemas/GoogleAuthTokenResponse'
          description: JWT token pair
        '400':
          content:
            application/json:
              examples:
                EmailNotVerified:
                  summary: Email not verified
                  value:
                    code: google_email_not_verified
                    detail: Google account email is not verified.
                InvalidToken:
                  summary: Invalid token
                  value:
                    code: google_invalid_token
                    detail: Invalid Google credential.
              schema:
                $ref: '#/components/schemas/GoogleAuthError'
          description: Invalid credential
        '401':
          content:
            application/json:
              examples:
                AccountDisabled:
                  summary: Account disabled
                  value:
                    code: google_account_disabled
                    detail: This account is disabled.
              schema:
                $ref: '#/components/schemas/GoogleAuthError'
          description: Account disabled
        '404':
          content:
            application/json:
              examples:
                FeatureDisabled:
                  summary: Feature disabled
                  value:
                    code: google_feature_disabled
                    detail: Not found.
              schema:
                $ref: '#/components/schemas/GoogleAuthError'
          description: Feature disabled
        '409':
          content:
            application/json:
              examples:
                SubConflict:
                  summary: Sub conflict
                  value:
                    code: google_sub_conflict
                    detail: Google account is already linked.
              schema:
                $ref: '#/components/schemas/GoogleAuthError'
          description: Google sub conflict
        '503':
          content:
            application/json:
              examples:
                VerifyUnavailable:
                  summary: Verify unavailable
                  value:
                    code: google_verify_unavailable
                    detail: Google sign-in is temporarily unavailable. Please try again.
              schema:
                $ref: '#/components/schemas/GoogleAuthError'
          description: Google verify unavailable
      summary: Sign in with Google (GIS ID token)
      tags:
      - Authentication
  /api/v1/auth/me/:
    get:
      description: Return the authenticated user's profile.
      operationId: users_me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: User profile
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
      security:
      - bearerAuth: []
      summary: Current user profile
      tags:
      - Users
  /api/v1/auth/password-reset/:
    post:
      description: Request a password reset email. Always returns a generic success message.
      operationId: auth_password_reset_request
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailMessage'
          description: Generic password-reset acknowledgment
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Validation error
      summary: Request password reset
      tags:
      - Authentication
  /api/v1/auth/password-reset/confirm/:
    post:
      description: Confirm password reset with uid + token and set a new password.
      operationId: auth_password_reset_confirm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailMessage'
          description: Password updated
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Invalid token or password
      summary: Confirm password reset
      tags:
      - Authentication
  /api/v1/auth/register/:
    post:
      description: Begin registration with email only. Always returns a generic success message (no account
        enumeration).
      operationId: auth_register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailMessage'
          description: Generic registration acknowledgment
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Validation error
      summary: Start registration
      tags:
      - Authentication
  /api/v1/auth/token/:
    post:
      description: Exchange email and password for access and refresh JWT tokens.
      operationId: auth_login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: JWT token pair
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Invalid credentials
      summary: Obtain JWT tokens
      tags:
      - Authentication
  /api/v1/auth/token/refresh/:
    post:
      description: Exchange a refresh token for a new access token.
      operationId: auth_refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: New access token
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Invalid refresh token
      summary: Refresh JWT access token
      tags:
      - Authentication
  /api/v1/billing/balance/:
    get:
      description: Return the authenticated user's prepaid credit balance.
      operationId: billing_balance
      responses:
        '200':
          content:
            application/json:
              examples:
                SampleBalance:
                  summary: Sample balance
                  value:
                    balance: '42.500000'
              schema:
                $ref: '#/components/schemas/Balance'
          description: Balance
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Billing disabled
      security:
      - bearerAuth: []
      summary: Account credit balance
      tags:
      - Billing
  /api/v1/billing/config/:
    get:
      description: Public currency / presentation config for catalog prices. Supports ETag / If-None-Match
        (304). No secrets.
      operationId: billing_config
      responses:
        '200':
          content:
            application/json:
              examples:
                USDTDisplayConfig:
                  summary: USDT display config
                  value:
                    billing_enabled: true
                    config_version: 1
                    display_decimals: 2
                    token_decimals: 6
                    token_name: Tether USD
                    token_symbol: USDT
              schema:
                $ref: '#/components/schemas/BillingConfig'
          description: Display currency config
        '304':
          description: Not modified (ETag match)
      summary: Billing display config
      tags:
      - Billing
  /api/v1/billing/deposit-info/:
    get:
      description: Polygon USDT deposit metadata including EIP-681 URI for the platform wallet.
      operationId: billing_deposit_info
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositInfo'
          description: Deposit info
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Billing disabled
      security:
      - bearerAuth: []
      summary: Deposit metadata
      tags:
      - Billing
  /api/v1/billing/verify-cex/:
    post:
      description: Verify an on-chain USDT transfer credited from a CEX or manual send.
      operationId: billing_verify_cex
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyDepositRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositRequest'
          description: Verified deposit
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositRequest'
          description: Accepted; waiting for confirmations
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Verification failed
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Billing disabled
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Duplicate transaction
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Blockchain RPC error
      security:
      - bearerAuth: []
      summary: Verify CEX / manual deposit
      tags:
      - Billing
  /api/v1/billing/verify-wallet/:
    post:
      description: Verify an on-chain USDT transfer initiated via WalletConnect. Requires ``WALLETCONNECT_ENABLED``.
      operationId: billing_verify_wallet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyDepositRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositRequest'
          description: Verified deposit
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositRequest'
          description: Accepted; waiting for confirmations
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Verification failed
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: WalletConnect disabled
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Billing disabled
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Duplicate transaction
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Blockchain RPC error
      security:
      - bearerAuth: []
      summary: Verify WalletConnect deposit
      tags:
      - Billing
  /api/v1/billing/vouchers/redeem/:
    post:
      description: 'Credit the authenticated billing account from a UNIQUE voucher or SHARED campaign
        code. Money path: VoucherRedeemService → CreditService (ADR 011). Requires ``BILLING_ENABLED``
        and ``VOUCHERS_ENABLED``.'
      operationId: billing_vouchers_redeem
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoucherRedeemRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                IdempotentReplay:
                  value:
                    balance: '120.500000'
                    credited: '25.000000'
                    replay: true
                Success:
                  value:
                    balance: '120.500000'
                    credited: '25.000000'
                    replay: false
              schema:
                $ref: '#/components/schemas/VoucherRedeemResponse'
          description: Credits applied (replay=true when already redeemed by this account)
        '400':
          content:
            application/json:
              examples:
                Expired:
                  value:
                    code: voucher_expired
                    detail: Voucher expired
                Invalid:
                  value:
                    code: voucher_invalid
                    detail: Invalid voucher code
                Revoked:
                  value:
                    code: voucher_revoked
                    detail: Voucher revoked
              schema:
                $ref: '#/components/schemas/VoucherError'
          description: Invalid / expired / revoked / reserved / limit
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              examples:
                Disabled:
                  value:
                    detail: Not found.
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Billing or vouchers disabled
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Rate limited (10 attempts / 5 minutes per user)
      security:
      - bearerAuth: []
      summary: Redeem voucher or campaign code
      tags:
      - Billing
      - Vouchers
  /api/v1/locations/:
    get:
      description: List catalog locations that have at least one active package.
      operationId: catalog_locations_list
      parameters:
      - description: A page number within the paginated result set.
        in: query
        name: page
        required: false
        schema:
          type: integer
      - description: 'Filter: popular | local | regional | global'
        in: query
        name: type
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLocationListList'
          description: Paginated locations
      summary: List locations
      tags:
      - Catalog
  /api/v1/locations/{slug}/:
    get:
      description: Retrieve a single location by slug, including broader coverage options.
      operationId: catalog_locations_retrieve
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
          description: Location
        '404':
          description: Location not found
      summary: Retrieve location
      tags:
      - Catalog
  /api/v1/me/esims/:
    get:
      description: List eSIMs owned by the authenticated user. By default archived eSIMs are omitted (``include_archived=false``).
        Filtering is applied before pagination. ``archived_at`` is presentation-only and does not affect
        lifecycle, top-up, billing, or provider sync.
      operationId: esim_list
      parameters:
      - description: When false (default), exclude rows with ``archived_at`` set. When true, include archived
          eSIMs in the page.
        examples:
          Default—HideArchived:
            description: GET /api/v1/me/esims/?include_archived=false
            summary: Default — hide archived
            value: false
          IncludeArchived:
            description: GET /api/v1/me/esims/?include_archived=true
            summary: Include archived
            value: true
        in: query
        name: include_archived
        schema:
          default: false
          type: boolean
      - description: A page number within the paginated result set.
        in: query
        name: page
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEsimList'
          description: Paginated eSIMs
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
      security:
      - bearerAuth: []
      summary: List my eSIMs
      tags:
      - eSIM
  /api/v1/me/esims/{id}/:
    get:
      description: Retrieve a single eSIM owned by the authenticated user.
      operationId: esim_retrieve
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Esim'
          description: eSIM
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: eSIM not found
      security:
      - bearerAuth: []
      summary: Retrieve my eSIM
      tags:
      - eSIM
    patch:
      description: Partially update an owned eSIM. Only ``note`` is writable. ``note`` is user-local metadata
        and is never synchronized to Airalo. ``archived_at`` is not writable here — use POST archive/unarchive.
        Auth-gated like other My eSIM endpoints (no dedicated throttle). PUT is not supported.
      operationId: esim_partial_update
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEsimRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Esim'
          description: eSIM
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Invalid request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: eSIM not found
      security:
      - bearerAuth: []
      summary: Update my eSIM note
      tags:
      - eSIM
  /api/v1/me/esims/{id}/archive/:
    post:
      description: 'Set ``archived_at`` on an owned eSIM (user-local visibility). Idempotent: if already
        archived, returns 200 with the current resource. Concurrent requests are safe; last committed
        write wins. Does not change lifecycle ``status``, top-up eligibility, or provider state. Always
        returns the full eSIM serializer body.'
      operationId: esim_archive
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Esim'
          description: eSIM (archived_at set)
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: eSIM not found
      security:
      - bearerAuth: []
      summary: Archive my eSIM
      tags:
      - eSIM
  /api/v1/me/esims/{id}/auto-topup/:
    delete:
      description: Delete the auto top-up policy. Requires matching ``If-Match`` version (or ``version``
        query param).
      operationId: esim_auto_topup_destroy
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Policy deleted
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: eSIM or policy not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Version conflict
      security:
      - bearerAuth: []
      summary: Delete auto top-up policy
      tags:
      - eSIM
    get:
      description: Return the auto top-up policy for an owned eSIM, if any.
      operationId: esim_auto_topup_retrieve
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoTopupPolicy'
          description: Policy
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: eSIM or policy not found
      security:
      - bearerAuth: []
      summary: Get auto top-up policy
      tags:
      - eSIM
    put:
      description: 'Upsert auto top-up policy (v2: ``expiry_enabled`` + ``usage_mode``). ``package_id``
        must be in Available top-ups. Optimistic concurrency via body ``version`` and/or ``If-Match``
        header (required when updating). Returns 409 if a purchase for this eSIM is still in progress.'
      operationId: esim_auto_topup_upsert
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoTopupPolicyWriteRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoTopupPolicy'
          description: Policy updated
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoTopupPolicy'
          description: Policy created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Invalid request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Rollout gate denied
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: eSIM/package not found or auto top-up disabled
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Version conflict or spend in progress
      security:
      - bearerAuth: []
      summary: Create or update auto top-up policy
      tags:
      - eSIM
  /api/v1/me/esims/{id}/events/:
    get:
      description: Chronological install / lifecycle trail for an owned eSIM.
      operationId: esim_events_list
