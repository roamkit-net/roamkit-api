        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleEvent'
          description: Event created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Invalid request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: eSIM not found
      security:
      - bearerAuth: []
      summary: Record eSIM lifecycle event
      tags:
      - eSIM
  /api/v1/me/esims/{id}/topups/:
    get:
      description: List available top-up packages for an owned eSIM. Additive pricing fields match catalog
        packages (``price_usd`` customer charge, ``list_price_usd`` provider list).
      operationId: esim_topups_list
      parameters:
      - in: path
        name: id
