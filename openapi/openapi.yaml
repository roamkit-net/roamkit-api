                $ref: '#/components/schemas/PaginatedTopupPackageList'
          description: Top-up package list
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: eSIM not found
      security:
      - bearerAuth: []
      summary: List top-up packages
      tags:
      - eSIM
    post:
      description: Purchase a top-up package using prepaid credits. Idempotent on ``idempotency_key``.
      operationId: esim_topups_purchase
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseTopupRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topup'
          description: Top-up created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Invalid request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCredits'
          description: Insufficient credits
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: eSIM/package not found or billing disabled
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Spend already in progress
      security:
      - bearerAuth: []
      summary: Purchase top-up
      tags:
      - eSIM
  /api/v1/me/esims/{id}/unarchive/:
    post:
      description: 'Clear ``archived_at`` on an owned eSIM (user-local visibility). Idempotent: if not
        archived, returns 200 with the current resource. Concurrent requests are safe; last committed
        write wins. Always returns the full eSIM serializer body.'
      operationId: esim_unarchive
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Esim'
          description: eSIM (archived_at cleared)
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: eSIM not found
      security:
      - bearerAuth: []
      summary: Unarchive my eSIM
      tags:
      - eSIM
  /api/v1/me/esims/{id}/usage/:
    get:
      description: Fetch live usage for an owned eSIM and refresh the cache.
      operationId: esim_usage
