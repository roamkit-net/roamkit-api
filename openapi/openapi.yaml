    PatchedEsimRequest:
      description: 'Owned eSIM with ICCID, install, setup, lifecycle, and order snapshot.


        ``note`` is the only writable field (PATCH). It is user-local metadata and

        is never synchronized to Airalo. ``archived_at`` is read-only here; mutate

        via POST archive/unarchive. Future RoamKit-only user metadata

        (``favorite_at``, ``pinned_at``, ``hidden_at``) belongs on the same model

        with the same non-sync rule — presentation only, never lifecycle.'
      properties:
        note:
          description: User-local note on this eSIM. Never synchronized to Airalo. Future user metadata
            (favorite_at, pinned_at, hidden_at) belongs on the same model without provider sync.
          maxLength: 255
          type: string
      type: object
    PricingPreviewRequestRequest:
      description: Preview inputs — package catalog id and/or explicit prices for topup.
      properties:
        account_id:
          format: uuid
          nullable: true
          type: string
        list_price_usd:
          format: decimal
          nullable: true
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          type: string
        net_price_usd:
          format: decimal
          nullable: true
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          type: string
        order_type:
          allOf:
          - $ref: '#/components/schemas/OrderTypeEnum'
          default: package
        package_id:
          description: Catalog ``Package.external_id`` when order_type=package.
          maxLength: 64
          type: string
      type: object
    PricingPreviewResponse:
      description: Internal preview response (may include ops-only fields).
      properties:
        discount_percent:
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          type: string
        floor_reason:
          type: string
        list_price_usd:
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          type: string
        price_usd:
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          type: string
        pricing_context_hash:
          type: string
        pricing_profile_id:
          format: uuid
          nullable: true
          type: string
        pricing_profile_slug:
          nullable: true
          type: string
        pricing_profile_version:
          nullable: true
          type: integer
        pricing_reason:
          type: string
        quote_fingerprint:
          type: string
        snapshot_schema_version:
          type: integer
      required:
      - discount_percent
      - floor_reason
      - list_price_usd
      - price_usd
      - pricing_context_hash
      - pricing_profile_id
      - pricing_profile_slug
      - pricing_profile_version
      - pricing_reason
      - quote_fingerprint
      - snapshot_schema_version
      type: object
