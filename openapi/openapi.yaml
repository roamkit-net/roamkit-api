openapi: 3.0.3
info:
  title: RoamKit API
  version: 1.0.0
  description: Self-service eSIM API. Public REST under `/api/v1/`. Authenticate with
    JWT Bearer tokens from `/api/v1/auth/token/`.
paths:
  /api/v1/auth/activate/:
    post:
      operationId: auth_activate
      description: Set password from the confirmation link and activate the account.
      summary: Activate account
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Activated user
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Invalid token or password
  /api/v1/auth/google/:
    post:
      operationId: auth_google
      description: Verify a Google Identity Services ID token and return the same
        SimpleJWT access/refresh pair as password login (ADR 015).
      summary: Sign in with Google (GIS ID token)
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
            examples:
              Request:
                value:
                  credential: <google_id_token>
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthTokenResponse'
              examples:
                Success:
                  value:
                    access: eyJ...
                    refresh: eyJ...
          description: JWT token pair
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthError'
              examples:
                InvalidToken:
                  value:
                    code: google_invalid_token
                    detail: Invalid Google credential.
                  summary: Invalid token
                EmailNotVerified:
                  value:
                    code: google_email_not_verified
                    detail: Google account email is not verified.
                  summary: Email not verified
          description: Invalid credential
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthError'
              examples:
                AccountDisabled:
                  value:
                    code: google_account_disabled
                    detail: This account is disabled.
                  summary: Account disabled
          description: Account disabled
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthError'
              examples:
                FeatureDisabled:
                  value:
                    code: google_feature_disabled
                    detail: Not found.
                  summary: Feature disabled
          description: Feature disabled
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthError'
              examples:
                SubConflict:
                  value:
                    code: google_sub_conflict
                    detail: Google account is already linked.
                  summary: Sub conflict
          description: Google sub conflict
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthError'
              examples:
                VerifyUnavailable:
                  value:
                    code: google_verify_unavailable
                    detail: Google sign-in is temporarily unavailable. Please try
                      again.
                  summary: Verify unavailable
          description: Google verify unavailable
  /api/v1/auth/me/:
    get:
      operationId: users_me
      description: Return the authenticated user's profile.
      summary: Current user profile
      tags:
      - Users
      security:
      - bearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: User profile
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
  /api/v1/auth/password-reset/:
    post:
      operationId: auth_password_reset_request
      description: Request a password reset email. Always returns a generic success
        message.
      summary: Request password reset
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailMessage'
          description: Generic password-reset acknowledgment
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Validation error
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm
      description: Confirm password reset with uid + token and set a new password.
      summary: Confirm password reset
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailMessage'
          description: Password updated
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Invalid token or password
  /api/v1/auth/register/:
    post:
      operationId: auth_register
      description: Begin registration with email only. Always returns a generic success
        message (no account enumeration).
      summary: Start registration
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailMessage'
          description: Generic registration acknowledgment
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Validation error
  /api/v1/auth/token/:
    post:
      operationId: auth_login
      description: Exchange email and password for access and refresh JWT tokens.
      summary: Obtain JWT tokens
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: JWT token pair
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Invalid credentials
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_refresh
      description: Exchange a refresh token for a new access token.
      summary: Refresh JWT access token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: New access token
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Invalid refresh token
  /api/v1/billing/balance/:
    get:
      operationId: billing_balance
      description: Return the authenticated user's prepaid credit balance.
      summary: Account credit balance
      tags:
      - Billing
      security:
      - bearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
              examples:
                SampleBalance:
                  value:
                    balance: '42.500000'
                  summary: Sample balance
          description: Balance
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Billing disabled
  /api/v1/billing/config/:
    get:
      operationId: billing_config
      description: Public currency / presentation config for catalog prices. Supports
        ETag / If-None-Match (304). No secrets.
      summary: Billing display config
      tags:
      - Billing
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingConfig'
              examples:
                USDTDisplayConfig:
                  value:
                    config_version: 1
                    token_symbol: USDT
                    token_name: Tether USD
                    token_decimals: 6
                    display_decimals: 2
                    billing_enabled: true
                  summary: USDT display config
          description: Display currency config
        '304':
          description: Not modified (ETag match)
  /api/v1/billing/deposit-info/:
    get:
      operationId: billing_deposit_info
      description: Polygon USDT deposit metadata including EIP-681 URI for the platform
        wallet.
      summary: Deposit metadata
      tags:
      - Billing
      security:
      - bearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositInfo'
          description: Deposit info
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Billing disabled
  /api/v1/billing/verify-cex/:
    post:
      operationId: billing_verify_cex
      description: Verify an on-chain USDT transfer credited from a CEX or manual
        send.
      summary: Verify CEX / manual deposit
      tags:
      - Billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyDepositRequest'
        required: true
      security:
      - bearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositRequest'
          description: Verified deposit
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositRequest'
          description: Accepted; waiting for confirmations
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Verification failed
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Billing disabled
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Duplicate transaction
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Blockchain RPC error
  /api/v1/billing/verify-wallet/:
    post:
      operationId: billing_verify_wallet
      description: Verify an on-chain USDT transfer initiated via WalletConnect. Requires
        ``WALLETCONNECT_ENABLED``.
      summary: Verify WalletConnect deposit
      tags:
      - Billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyDepositRequest'
        required: true
      security:
      - bearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositRequest'
          description: Verified deposit
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositRequest'
          description: Accepted; waiting for confirmations
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Verification failed
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: WalletConnect disabled
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Billing disabled
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Duplicate transaction
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Blockchain RPC error
  /api/v1/billing/vouchers/redeem/:
    post:
      operationId: billing_vouchers_redeem
      description: 'Credit the authenticated billing account from a UNIQUE voucher
        or SHARED campaign code. Money path: VoucherRedeemService → CreditService
        (ADR 011). Requires ``BILLING_ENABLED`` and ``VOUCHERS_ENABLED``.'
      summary: Redeem voucher or campaign code
      tags:
      - Billing
      - Vouchers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoucherRedeemRequestRequest'
        required: true
      security:
      - bearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoucherRedeemResponse'
              examples:
                Success:
                  value:
                    credited: '25.000000'
                    balance: '120.500000'
                    replay: false
                IdempotentReplay:
                  value:
                    credited: '25.000000'
                    balance: '120.500000'
                    replay: true
          description: Credits applied (replay=true when already redeemed by this
            account)
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoucherError'
              examples:
                Invalid:
                  value:
                    code: voucher_invalid
                    detail: Invalid voucher code
                Expired:
                  value:
                    code: voucher_expired
                    detail: Voucher expired
                Revoked:
                  value:
                    code: voucher_revoked
                    detail: Voucher revoked
          description: Invalid / expired / revoked / reserved / limit
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Disabled:
                  value:
                    detail: Not found.
          description: Billing or vouchers disabled
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Rate limited (10 attempts / 5 minutes per user)
  /api/v1/locations/:
    get:
      operationId: catalog_locations_list
      description: List catalog locations that have at least one active package.
      summary: List locations
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
        description: 'Filter: popular | local | regional | global'
      tags:
      - Catalog
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLocationListList'
          description: Paginated locations
  /api/v1/locations/{slug}/:
    get:
      operationId: catalog_locations_retrieve
      description: Retrieve a single location by slug, including broader coverage
        options.
      summary: Retrieve location
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Catalog
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
          description: Location
        '404':
          description: Location not found
  /api/v1/me/esims/:
    get:
      operationId: esim_list
      description: List eSIMs owned by the authenticated user.
      summary: List my eSIMs
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - eSIM
      security:
      - bearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEsimList'
          description: Paginated eSIMs
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
  /api/v1/me/esims/{id}/:
    get:
      operationId: esim_retrieve
      description: Retrieve a single eSIM owned by the authenticated user.
      summary: Retrieve my eSIM
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - eSIM
      security:
      - bearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Esim'
          description: eSIM
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: eSIM not found
  /api/v1/me/esims/{id}/events/:
    get:
      operationId: esim_events_list
      description: Chronological install / lifecycle trail for an owned eSIM.
      summary: List eSIM lifecycle events
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - eSIM
      security:
      - bearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLifecycleEventList'
          description: Lifecycle events
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: eSIM not found
    post:
      operationId: esim_events_create
      description: Record a client install/telemetry event. Idempotent on ``idempotency_key``
        per eSIM.
      summary: Record eSIM lifecycle event
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - eSIM
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleEventCreateRequest'
        required: true
      security:
      - bearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleEvent'
          description: Existing event (idempotent replay)
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleEvent'
          description: Event created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Invalid request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: eSIM not found
  /api/v1/me/esims/{id}/topups/:
    get:
      operationId: esim_topups_list
      description: List available top-up packages for an owned eSIM.
      summary: List top-up packages
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - eSIM
      security:
      - bearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Top-up package list
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: eSIM not found
    post:
      operationId: esim_topups_purchase
      description: Purchase a top-up package using prepaid credits. Idempotent on
        ``idempotency_key``.
      summary: Purchase top-up
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - eSIM
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseTopupRequest'
        required: true
      security:
      - bearerAuth: []
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topup'
          description: Top-up created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Invalid request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCredits'
          description: Insufficient credits
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: eSIM/package not found or billing disabled
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Spend already in progress
  /api/v1/me/esims/{id}/usage/:
    get:
      operationId: esim_usage
      description: Fetch live usage for an owned eSIM and refresh the cache.
      summary: eSIM usage
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - eSIM
      security:
      - bearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
          description: Usage snapshot
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: eSIM not found
  /api/v1/orders/:
    post:
      operationId: orders_create
      description: Debit prepaid credits then fulfill via the order provider. Idempotent
        on ``idempotency_key`` (replay returns 201 with the same body).
      summary: Create package order
      tags:
      - Orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              CreateOrder:
                value:
                  package_id: airalo-pkg-123
                  idempotency_key: client-order-uuid-1
                summary: Create order
        required: true
      security:
      - bearerAuth: []
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: Order created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Invalid request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCredits'
              examples:
                InsufficientCredits:
                  value:
                    code: INSUFFICIENT_CREDITS
                    detail: Insufficient funds
                    required: '19.500000'
                    balance: '5.000000'
                    missing: '14.500000'
                  summary: Insufficient credits
          description: Insufficient credits
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Package not found or billing disabled
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Spend already in progress
  /api/v1/packages/:
    get:
      operationId: catalog_packages_list
      description: List active packages synced from external providers.
      summary: List packages
      parameters:
      - in: query
        name: country
        schema:
          type: string
        description: Filter by ISO country code
      - in: query
        name: location
        schema:
          type: string
        description: Filter by location slug
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Catalog
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPackageList'
          description: Paginated packages
components:
  schemas:
    ActivateRequest:
      type: object
      properties:
