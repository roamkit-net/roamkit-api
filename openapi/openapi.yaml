    VerifyDepositRequest:
      type: object
      properties:
        tx_hash:
          type: string
          minLength: 1
          maxLength: 128
        amount_requested:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,6})?$
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - amount_requested
      - idempotency_key
      - tx_hash
    VoucherError:
      type: object
      properties:
        code:
          type: string
        detail:
          type: string
      required:
      - code
      - detail
    VoucherRedeemRequestRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - code
    VoucherRedeemResponse:
      type: object
      properties:
        credited:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,6})?$
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,6})?$
        replay:
          type: boolean
          default: false
      required:
      - balance
      - credited
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
