openapi: 3.0.3
info:
  description: Self-service eSIM API. Public REST under `/api/v1/`. Authenticate with JWT Bearer tokens
    from `/api/v1/auth/token/`.
  title: RoamKit API
  version: 1.0.0
servers:
- description: Staging
  url: https://api.staging.roamkit.net
- description: Production
  url: https://api.roamkit.net
tags:
- description: Registration, login, and password reset
  name: Authentication
- description: Prepaid credits, deposits, and wallet balance
  name: Billing
- description: Package purchase orders
  name: Orders
- description: Packages and locations
  name: Catalog
- description: User eSIM inventory, usage, and top-ups
  name: eSIM
- description: Authenticated user profile
  name: Users
paths:
  /api/v1/auth/activate/:
    post:
      description: Set password from the confirmation link and activate the account.
      operationId: auth_activate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Activated user
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Invalid token or password
      summary: Activate account
      tags:
      - Authentication
  /api/v1/auth/me/:
    get:
      description: Return the authenticated user's profile.
      operationId: users_me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: User profile
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
      security:
      - bearerAuth: []
      summary: Current user profile
      tags:
      - Users
  /api/v1/auth/password-reset/:
    post:
      description: Request a password reset email. Always returns a generic success message.
      operationId: auth_password_reset_request
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailMessage'
          description: Generic password-reset acknowledgment
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Validation error
      summary: Request password reset
      tags:
      - Authentication
  /api/v1/auth/password-reset/confirm/:
    post:
      description: Confirm password reset with uid + token and set a new password.
      operationId: auth_password_reset_confirm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailMessage'
          description: Password updated
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Invalid token or password
      summary: Confirm password reset
      tags:
      - Authentication
  /api/v1/auth/register/:
    post:
      description: Begin registration with email only. Always returns a generic success message (no account
        enumeration).
      operationId: auth_register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailMessage'
          description: Generic registration acknowledgment
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Validation error
      summary: Start registration
      tags:
      - Authentication
  /api/v1/auth/token/:
    post:
      description: Exchange email and password for access and refresh JWT tokens.
      operationId: auth_login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: JWT token pair
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Invalid credentials
      summary: Obtain JWT tokens
      tags:
      - Authentication
  /api/v1/auth/token/refresh/:
    post:
      description: Exchange a refresh token for a new access token.
      operationId: auth_refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: New access token
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Invalid refresh token
      summary: Refresh JWT access token
      tags:
      - Authentication
  /api/v1/billing/balance/:
    get:
      description: Return the authenticated user's prepaid credit balance.
      operationId: billing_balance
      responses:
        '200':
          content:
            application/json:
              examples:
                SampleBalance:
                  summary: Sample balance
                  value:
                    balance: '42.500000'
              schema:
                $ref: '#/components/schemas/Balance'
          description: Balance
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Billing disabled
      security:
      - bearerAuth: []
      summary: Account credit balance
      tags:
      - Billing
  /api/v1/billing/config/:
    get:
      description: Public currency / presentation config for catalog prices. Supports ETag / If-None-Match
        (304). No secrets.
      operationId: billing_config
      responses:
        '200':
          content:
            application/json:
              examples:
                USDTDisplayConfig:
                  summary: USDT display config
                  value:
                    billing_enabled: true
                    config_version: 1
                    display_decimals: 2
                    token_decimals: 6
                    token_name: Tether USD
                    token_symbol: USDT
              schema:
                $ref: '#/components/schemas/BillingConfig'
          description: Display currency config
        '304':
          description: Not modified (ETag match)
      summary: Billing display config
      tags:
      - Billing
  /api/v1/billing/deposit-info/:
    get:
      description: Polygon USDT deposit metadata including EIP-681 URI for the platform wallet.
      operationId: billing_deposit_info
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositInfo'
          description: Deposit info
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Billing disabled
      security:
      - bearerAuth: []
      summary: Deposit metadata
      tags:
      - Billing
  /api/v1/billing/verify-cex/:
    post:
      description: Verify an on-chain USDT transfer credited from a CEX or manual send.
      operationId: billing_verify_cex
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyDepositRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositRequest'
          description: Verified deposit
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositRequest'
          description: Accepted; waiting for confirmations
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Verification failed
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Billing disabled
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Duplicate transaction
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Blockchain RPC error
      security:
      - bearerAuth: []
      summary: Verify CEX / manual deposit
      tags:
      - Billing
  /api/v1/billing/verify-wallet/:
    post:
      description: Verify an on-chain USDT transfer initiated via WalletConnect. Requires ``WALLETCONNECT_ENABLED``.
      operationId: billing_verify_wallet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyDepositRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositRequest'
          description: Verified deposit
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositRequest'
          description: Accepted; waiting for confirmations
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Verification failed
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: WalletConnect disabled
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Billing disabled
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Duplicate transaction
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Blockchain RPC error
      security:
      - bearerAuth: []
      summary: Verify WalletConnect deposit
      tags:
      - Billing
  /api/v1/locations/:
    get:
      description: List catalog locations that have at least one active package.
      operationId: catalog_locations_list
      parameters:
      - description: A page number within the paginated result set.
        in: query
        name: page
        required: false
        schema:
          type: integer
      - description: 'Filter: popular | local | regional | global'
        in: query
        name: type
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLocationListList'
          description: Paginated locations
      summary: List locations
      tags:
      - Catalog
  /api/v1/locations/{slug}/:
    get:
      description: Retrieve a single location by slug, including broader coverage options.
      operationId: catalog_locations_retrieve
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
          description: Location
        '404':
          description: Location not found
      summary: Retrieve location
      tags:
      - Catalog
  /api/v1/me/esims/:
    get:
      description: List eSIMs owned by the authenticated user.
      operationId: esim_list
      parameters:
      - description: A page number within the paginated result set.
        in: query
        name: page
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEsimList'
          description: Paginated eSIMs
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
      security:
      - bearerAuth: []
      summary: List my eSIMs
      tags:
      - eSIM
  /api/v1/me/esims/{id}/:
    get:
      description: Retrieve a single eSIM owned by the authenticated user.
      operationId: esim_retrieve
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Esim'
          description: eSIM
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: eSIM not found
      security:
      - bearerAuth: []
      summary: Retrieve my eSIM
      tags:
      - eSIM
  /api/v1/me/esims/{id}/topups/:
    get:
      description: List available top-up packages for an owned eSIM.
      operationId: esim_topups_list
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Top-up package list
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: eSIM not found
      security:
      - bearerAuth: []
      summary: List top-up packages
      tags:
      - eSIM
    post:
      description: Purchase a top-up package using prepaid credits. Idempotent on ``idempotency_key``.
      operationId: esim_topups_purchase
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseTopupRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topup'
          description: Top-up created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Invalid request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCredits'
          description: Insufficient credits
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: eSIM/package not found or billing disabled
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Spend already in progress
      security:
      - bearerAuth: []
      summary: Purchase top-up
      tags:
      - eSIM
  /api/v1/me/esims/{id}/usage/:
    get:
      description: Fetch live usage for an owned eSIM and refresh the cache.
      operationId: esim_usage
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
          description: Usage snapshot
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: eSIM not found
      security:
      - bearerAuth: []
      summary: eSIM usage
      tags:
      - eSIM
  /api/v1/orders/:
    post:
      description: Debit prepaid credits then fulfill via the order provider. Idempotent on ``idempotency_key``
        (replay returns 201 with the same body).
      operationId: orders_create
      requestBody:
        content:
          application/json:
            examples:
              CreateOrder:
                summary: Create order
                value:
                  idempotency_key: client-order-uuid-1
                  package_id: airalo-pkg-123
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: Order created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Invalid request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '402':
          content:
            application/json:
              examples:
                InsufficientCredits:
                  summary: Insufficient credits
                  value:
                    balance: '5.000000'
                    code: INSUFFICIENT_CREDITS
                    detail: Insufficient funds
                    missing: '14.500000'
                    required: '19.500000'
              schema:
                $ref: '#/components/schemas/InsufficientCredits'
          description: Insufficient credits
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Package not found or billing disabled
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Spend already in progress
      security:
      - bearerAuth: []
      summary: Create package order
      tags:
      - Orders
  /api/v1/packages/:
    get:
      description: List active packages synced from external providers.
      operationId: catalog_packages_list
      parameters:
      - description: Filter by ISO country code
        in: query
        name: country
        schema:
          type: string
      - description: Filter by location slug
        in: query
        name: location
        schema:
          type: string
      - description: A page number within the paginated result set.
        in: query
        name: page
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPackageList'
          description: Paginated packages
      summary: List packages
      tags:
      - Catalog
components:
  schemas:
    ActivateRequest:
      properties:
        password:
          maxLength: 128
          minLength: 8
          type: string
          writeOnly: true
        password_confirm:
          maxLength: 128
          minLength: 8
          type: string
          writeOnly: true
        token:
          minLength: 1
          type: string
        uid:
          minLength: 1
          type: string
      required:
      - password
      - password_confirm
      - token
      - uid
      type: object
    Balance:
      properties:
        balance:
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,6})?$
          type: string
      required:
      - balance
      type: object
    BillingConfig:
      description: Public currency / presentation config (ADR-010 ``GET …/billing/config/``).
      properties:
        billing_enabled:
          type: boolean
        config_version:
          type: integer
        display_decimals:
          type: integer
        token_decimals:
          type: integer
        token_name:
          type: string
        token_symbol:
          type: string
      required:
      - billing_enabled
      - config_version
      - display_decimals
      - token_decimals
      - token_name
      - token_symbol
      type: object
    CoverageTypeEnum:
      description: '* `local` - Local

        * `regional` - Regional

        * `global` - Global'
      enum:
      - local
      - regional
      - global
      type: string
    CreateOrderRequest:
      description: Request body for POST /api/v1/orders/.
      properties:
        idempotency_key:
          maxLength: 128
          minLength: 1
          type: string
        package_id:
          maxLength: 64
          minLength: 1
          type: string
      required:
      - idempotency_key
      - package_id
      type: object
    DepositInfo:
      description: Full Polygon USDT deposit metadata for clients (no hardcoded chain/token).
      properties:
        chain_id:
          type: integer
        contract:
          type: string
        eip681_uri:
          type: string
        min_confirmations:
          type: integer
        subscriptions_enabled:
          type: boolean
        token_decimals:
          type: integer
        token_symbol:
          type: string
        wallet:
          type: string
        walletconnect_enabled:
          type: boolean
      required:
      - chain_id
      - contract
      - eip681_uri
      - min_confirmations
      - subscriptions_enabled
      - token_decimals
      - token_symbol
      - wallet
      - walletconnect_enabled
      type: object
    DepositPaymentMethodEnum:
      description: '* `wallet_connect` - WalletConnect

        * `cex_manual` - CEX manual'
      enum:
      - wallet_connect
      - cex_manual
      type: string
    DepositRequest:
      properties:
        amount_credited:
          format: decimal
          nullable: true
          pattern: ^-?\d{0,14}(?:\.\d{0,6})?$
          readOnly: true
          type: string
        amount_requested:
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,6})?$
          readOnly: true
          type: string
        created_at:
          format: date-time
          readOnly: true
          type: string
        failure_reason:
          readOnly: true
          type: string
        id:
          format: uuid
          readOnly: true
          type: string
        idempotency_key:
          readOnly: true
          type: string
        payment_method:
          allOf:
          - $ref: '#/components/schemas/DepositPaymentMethodEnum'
          description: 'How the USDT transfer was initiated (WalletConnect or CEX/manual).


            * `wallet_connect` - WalletConnect

            * `cex_manual` - CEX manual'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/DepositRequestStatusEnum'
          description: 'Deposit verification status (pending / completed / failed).


            * `pending` - Pending

            * `completed` - Completed

            * `failed` - Failed'
          readOnly: true
        tx_hash:
          nullable: true
          readOnly: true
          type: string
        updated_at:
          format: date-time
          readOnly: true
          type: string
        verified_at:
          format: date-time
          nullable: true
          readOnly: true
          type: string
      required:
      - amount_credited
      - amount_requested
      - created_at
      - failure_reason
      - id
      - idempotency_key
      - payment_method
      - status
      - tx_hash
      - updated_at
      - verified_at
      type: object
    DepositRequestStatusEnum:
      description: '* `pending` - Pending

        * `completed` - Completed

        * `failed` - Failed'
      enum:
      - pending
      - completed
      - failed
      type: string
    DetailMessage:
      description: Generic success message with a ``detail`` string.
      properties:
        detail:
          type: string
      required:
      - detail
      type: object
    ErrorDetail:
      description: 'Standard DRF ``{"detail": "..."}`` error body.'
      properties:
        detail:
          type: string
      required:
      - detail
      type: object
    Esim:
      description: Owned eSIM with ICCID and installation / QR fields.
      properties:
        created_at:
          format: date-time
          readOnly: true
          type: string
        direct_apple_installation_url:
          format: uri
          readOnly: true
          type: string
        iccid:
          readOnly: true
          type: string
        id:
          readOnly: true
          type: integer
        installation_guide_url:
          format: uri
          readOnly: true
          type: string
        lpa:
          readOnly: true
          type: string
        manual_installation:
          readOnly: true
          type: string
        matching_id:
          readOnly: true
          type: string
        qrcode:
          readOnly: true
          type: string
        qrcode_installation:
          readOnly: true
          type: string
        qrcode_url:
          format: uri
          readOnly: true
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/EsimStatusEnum'
          readOnly: true
        updated_at:
          format: date-time
          readOnly: true
          type: string
        usage_expired_at:
          format: date-time
          nullable: true
          readOnly: true
          type: string
        usage_is_unlimited:
          nullable: true
          readOnly: true
          type: boolean
        usage_remaining_mb:
          nullable: true
          readOnly: true
          type: integer
        usage_status:
          readOnly: true
          type: string
        usage_synced_at:
          format: date-time
          nullable: true
          readOnly: true
          type: string
