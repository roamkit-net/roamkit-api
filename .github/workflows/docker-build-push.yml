# Build Docker image, Trivy scan, push to GHCR

name: Docker Build Push

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      context:
        required: false
        type: string
        default: .
    secrets:
      GHCR_TOKEN:
        required: true

jobs:
  build:
    runs-on:
      - self-hosted
      - linux
      - x64
      - roamkit
      - docker
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/roamkit-net/${{ inputs.image-name }}
          # Immutable SHA only. The branch tag is applied after Trivy, on this
          # same manifest, so a failed scan cannot move :main or :develop.
          tags: |
            type=raw,value=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ROAMKIT_GIT_SHA=${{ github.sha }}
            ROAMKIT_BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            ROAMKIT_IMAGE_TAG=${{ github.sha }}
            ROAMKIT_ENVIRONMENT=${{ github.ref_name == 'main' && 'production' || github.ref_name }}

      - name: Trivy scan
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/roamkit-net/${{ inputs.image-name }}:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Promote scanned image to branch tag
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          case "${{ github.ref_name }}" in
            main|develop) ;;
            *)
              echo "ERROR: refusing to promote branch tag for ${{ github.ref_name }}" >&2
              exit 1
              ;;
          esac
          SRC="ghcr.io/roamkit-net/${{ inputs.image-name }}:${{ github.sha }}"
          DEST="ghcr.io/roamkit-net/${{ inputs.image-name }}:${{ github.ref_name }}"
          src_digest="$(docker buildx imagetools inspect "$SRC" | awk '/^Digest:/ {print $2; exit}')"
          if [ -z "${src_digest}" ]; then
            echo "ERROR: scanned image has no digest: ${SRC}" >&2
            exit 1
          fi
          # Retag the existing manifest. Do not build a second image.
          docker buildx imagetools create --tag "$DEST" "$SRC"
          dest_digest="$(docker buildx imagetools inspect "$DEST" | awk '/^Digest:/ {print $2; exit}')"
          if [ "${src_digest}" != "${dest_digest}" ]; then
            echo "ERROR: branch tag digest ${dest_digest} != scanned digest ${src_digest}" >&2
            exit 1
          fi
          echo "Promoted ${DEST} to scanned digest ${src_digest}"
