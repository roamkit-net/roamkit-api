# Secret scanning (Gate C / ADR 013 must-have C4)

name: Secret Scan

on:
  workflow_call:

jobs:
  gitleaks:
    runs-on:
      - self-hosted
      - linux
      - x64
      - roamkit
      - default
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
