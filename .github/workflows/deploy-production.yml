# Deploy to Hetzner production on merge to main (ADR 013 / Gate C)

name: Deploy Production

on:
  workflow_call:
    inputs:
      stack-dir:
        required: false
        type: string
        default: /opt/stacks/roamkit-production
    secrets:
      PRODUCTION_HOST:
        required: true
      PRODUCTION_SSH_KEY:
        required: true

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
      - x64
      - roamkit
      - default
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: root
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd ${{ inputs.stack-dir }}
            export API_IMAGE=ghcr.io/roamkit-net/roamkit-api:${{ github.sha }}
            export WEB_IMAGE=ghcr.io/roamkit-net/roamkit-web:${{ github.sha }}
            ./scripts/deploy-production.sh

      - name: Smoke test (from runner)
        run: |
          wait_http() {
            local url="$1"
            local i
            for i in $(seq 1 20); do
              if curl -4sf --max-time 15 "${url}" >/dev/null; then
                return 0
              fi
              sleep 3
            done
            echo "Smoke failed: ${url}" >&2
            return 1
          }
          wait_http https://api.roamkit.net/health/live
          wait_http https://api.roamkit.net/health/ready
          wait_http https://api.roamkit.net/version
