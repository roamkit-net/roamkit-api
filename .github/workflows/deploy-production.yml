# Deploy to Hetzner production on merge to main (ADR 013 / Gate C)
#
# Cross-repo pairing: this workflow owns API_IMAGE (this repo SHA).
# WEB_IMAGE uses the roamkit-web :main branch tag — never this repo's SHA.
# Persist pins into host .env so later recreates do not drift (Gate D lesson).

name: Deploy Production

on:
  workflow_call:
    inputs:
      stack-dir:
        required: false
        type: string
        default: /opt/stacks/roamkit-production
    secrets:
      PRODUCTION_HOST:
        required: true
      PRODUCTION_SSH_KEY:
        required: true

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
      - x64
      - roamkit
      - default
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: root
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -euo pipefail
            STACK_DIR="${{ inputs.stack-dir }}"
            cd "$STACK_DIR"
            API_IMAGE="ghcr.io/roamkit-net/roamkit-api:${{ github.sha }}"
            WEB_IMAGE="ghcr.io/roamkit-net/roamkit-web:main"
            export API_IMAGE WEB_IMAGE
            # Persist pins + API fingerprint (env_file overrides image bake).
            if grep -q '^API_IMAGE=' .env; then
              sed -i "s|^API_IMAGE=.*|API_IMAGE=${API_IMAGE}|" .env
            else
              echo "API_IMAGE=${API_IMAGE}" >> .env
            fi
            if grep -q '^WEB_IMAGE=' .env; then
              sed -i "s|^WEB_IMAGE=.*|WEB_IMAGE=${WEB_IMAGE}|" .env
            else
              echo "WEB_IMAGE=${WEB_IMAGE}" >> .env
            fi
            if grep -q '^ROAMKIT_GIT_SHA=' .env; then
              sed -i "s|^ROAMKIT_GIT_SHA=.*|ROAMKIT_GIT_SHA=${{ github.sha }}|" .env
            else
              echo "ROAMKIT_GIT_SHA=${{ github.sha }}" >> .env
            fi
            if grep -q '^ROAMKIT_IMAGE_TAG=' .env; then
              sed -i "s|^ROAMKIT_IMAGE_TAG=.*|ROAMKIT_IMAGE_TAG=${{ github.sha }}|" .env
            else
              echo "ROAMKIT_IMAGE_TAG=${{ github.sha }}" >> .env
            fi
            ./scripts/deploy-production.sh

      - name: Smoke test (from runner)
        run: |
          wait_http() {
            local url="$1"
            local i
            for i in $(seq 1 20); do
              if curl -4sf --max-time 15 "${url}" >/dev/null; then
                return 0
              fi
              sleep 3
            done
            echo "Smoke failed: ${url}" >&2
            return 1
          }
          wait_http https://api.roamkit.net/health/live
          wait_http https://api.roamkit.net/health/ready
          wait_http https://api.roamkit.net/version
