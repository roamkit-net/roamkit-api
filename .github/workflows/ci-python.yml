# Reusable CI for Python (roamkit-api)

name: CI Python

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.12"
      coverage-threshold:
        required: false
        type: string
        default: "70"

jobs:
  lint:
    runs-on:
      - self-hosted
      - linux
      - x64
      - roamkit
      - default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install lint tools
        # Pin Black to match requirements/dev.txt (black>=24.0,<25).
        # Unpinned `pip install black` can pull 26.x and disagree on wrapping.
        run: pip install ruff "black>=24.0,<25" bandit
      - name: Ruff
        run: ruff check src/ tests/
      - name: Black
        run: black --check src/ tests/
      - name: Bandit
        run: bandit -r src/ -ll

  openapi:
    runs-on:
      - self-hosted
      - linux
      - x64
      - roamkit
      - default
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
      - name: Validate OpenAPI schema
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          PYTHONPATH: src
        run: |
          chmod +x scripts/generate_openapi.sh
          ./scripts/generate_openapi.sh
          # Ensure generation is deterministic: re-run must not change the file.
          cp openapi/openapi.yaml /tmp/openapi-first.yaml
          ./scripts/generate_openapi.sh
          diff -u /tmp/openapi-first.yaml openapi/openapi.yaml
          # Committed artifact must match generated output.
          if ! git diff --exit-code -- openapi/openapi.yaml; then
            echo "::error::Committed openapi/openapi.yaml is stale."
            echo "Run:"
            echo "  ./scripts/generate_openapi.sh"
            echo "Then commit the updated openapi/openapi.yaml."
            exit 1
          fi
      - name: Setup Node (Spectral)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Spectral lint (errors fail; warnings report-only)
        run: |
          npm exec --yes --package=@stoplight/spectral-cli@6.16.2 -- \
            spectral lint openapi/openapi.yaml \
            --ruleset .spectral.yaml \
            --fail-severity error
      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-yaml
          path: openapi/openapi.yaml
          if-no-files-found: error

  migration-smoke:
    runs-on:
      - self-hosted
      - linux
      - x64
      - roamkit
      - docker
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Start test infrastructure
        run: docker compose -f docker/docker-compose.test.yml up -d --wait
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
      - name: Restore dump, migrate, verify
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5433
          POSTGRES_USER: roamkit
          POSTGRES_PASSWORD: roamkit_test
          REDIS_URL: redis://localhost:6380/0
        run: |
          chmod +x scripts/run_migration_smoke.sh
          ./scripts/run_migration_smoke.sh
      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.test.yml down -v

  test:
    runs-on:
      - self-hosted
      - linux
      - x64
      - roamkit
      - docker
    needs: [lint, migration-smoke, openapi]
    steps:
      - uses: actions/checkout@v4
      - name: Start test infrastructure
        run: |
          docker compose -f docker/docker-compose.test.yml up -d --wait
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
      - name: Pytest with coverage
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5433
          POSTGRES_DB: roamkit_test
          POSTGRES_USER: roamkit
          POSTGRES_PASSWORD: roamkit_test
          REDIS_URL: redis://localhost:6380/0
        run: |
          pytest --cov=src --cov-report=term-missing --cov-fail-under=${{ inputs.coverage-threshold }}
      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.test.yml down -v
