# Deploy to Hetzner staging on merge to develop

name: Deploy Staging

on:
  workflow_call:
    inputs:
      stack-dir:
        required: false
        type: string
        default: /opt/stacks/roamkit-net
    secrets:
      STAGING_HOST:
        required: true
      STAGING_SSH_KEY:
        required: true

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
      - x64
      - roamkit
      - default
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: root
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ${{ inputs.stack-dir }}
            export API_IMAGE=ghcr.io/roamkit-net/roamkit-api:${{ github.sha }}
            export WEB_IMAGE=ghcr.io/roamkit-net/roamkit-web:develop
            ./scripts/deploy-staging.sh

      - name: Smoke test (from runner)
        run: |
          # Prefer IPv4: Cloudflare AAAA can fail from the runner; on-host smoke uses -4.
          wait_http() {
            local url="$1"
            local i
            for i in $(seq 1 20); do
              if curl -4sf --max-time 15 "${url}" >/dev/null; then
                return 0
              fi
              sleep 3
            done
            echo "Smoke failed: ${url}" >&2
            return 1
          }
          wait_http https://api.staging.roamkit.net/health/live
          wait_http https://api.staging.roamkit.net/health/ready
