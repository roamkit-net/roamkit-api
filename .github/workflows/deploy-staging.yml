# Deploy to Hetzner staging on merge to develop

name: Deploy Staging

on:
  workflow_call:
    inputs:
      stack-dir:
        required: false
        type: string
        default: /opt/stacks/roamkit-net

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: root
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ${{ inputs.stack-dir }}
            export API_IMAGE=ghcr.io/roamkit-net/roamkit-api:${{ github.sha }}
            export WEB_IMAGE=ghcr.io/roamkit-net/roamkit-web:develop
            ./scripts/deploy-staging.sh

      - name: Smoke test (from runner)
        run: |
          curl -sf https://api.staging.roamkit.net/health/live
          curl -sf https://api.staging.roamkit.net/health/ready
